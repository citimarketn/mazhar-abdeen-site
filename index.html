<style>
  :root{
    --bg:#FAF9F6;
    --bg-rgb:250,249,246;
    --yellow:#F5B301;
    --link:#1B4FC4;
    --hero-tint: linear-gradient(135deg, rgba(47,111,237,0.20), rgba(20,184,146,0.14));
    --hero-img-opacity:.30;
    --bg-2:#F1EFE8;
    --ink:#0E1B2B;
    --ink-soft:#4B586B;
    --navy:#122447;
    --blue:#2F6FED;
    --blue-deep:#1b37c4;
    --mint:#14B892;
    --line: rgba(14,27,43,0.10);
    --card: #FFFFFF;
    --shadow: 0 18px 46px rgba(18,36,71,0.12);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1420;
      --bg-rgb:14,20,32;
      --link:#8DB3FF;
      --hero-tint: linear-gradient(135deg, rgba(47,111,237,0.34), rgba(14,20,32,0.55));
      --hero-img-opacity:.42;
      --bg-2:#141B29;
      --ink:#EDEFF4;
      --ink-soft:#A9B2C4;
      --navy:#EDEFF4;
      --line: rgba(237,239,244,0.12);
      --card:#171E2D;
      --shadow: 0 18px 46px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1420;
    --bg-rgb:14,20,32;
    --link:#8DB3FF;
    --hero-tint: linear-gradient(135deg, rgba(47,111,237,0.34), rgba(14,20,32,0.55));
    --hero-img-opacity:.42;
    --bg-2:#141B29;
    --ink:#EDEFF4;
    --ink-soft:#A9B2C4;
    --navy:#EDEFF4;
    --line: rgba(237,239,244,0.12);
    --card:#171E2D;
    --shadow: 0 18px 46px rgba(0,0,0,0.4);
  }
  body{ transition: background .25s ease, color .25s ease; }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family:"Cairo","Segoe UI",sans-serif;
    line-height:1.7;
  }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3,p{ margin:0; }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:6px; }
  [hidden]{ display:none !important; }

  .wrap{ max-width:1100px; margin-inline:auto; padding-inline:24px; }

  /* Navbar */
  .navbar{
    position:sticky; top:0; z-index:40;
    background: rgba(var(--bg-rgb),0.82);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 24px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }

  .nav-links{ display:flex; gap:26px; align-items:center; }
  .nav-links a{ font-size:14.5px; font-weight:700; color: var(--ink-soft); }
  .nav-links a:hover{ color: var(--blue); }
  .nav-actions{ display:flex; gap:10px; align-items:center; }
  @media (max-width:720px){ .nav-links{ display:none; } }

  .pill-btn{
    font-family:inherit; font-weight:700; font-size:13.5px;
    background: var(--card); color: var(--ink);
    border: 1.5px solid var(--line);
    padding: 8px 16px; border-radius:999px; cursor:pointer;
    transition: border-color .18s ease, transform .18s ease;
  }
  .pill-btn:hover{ border-color: var(--blue); transform: translateY(-1px); }

  .hero::after{
    content:""; position:absolute; inset:0; z-index:-1;
    background:
      linear-gradient(180deg, rgba(var(--bg-rgb),.5) 0%, rgba(var(--bg-rgb),0) 34%, rgba(var(--bg-rgb),.80) 80%, var(--bg) 100%),
      var(--hero-tint);
  }
  .hero-inner{ display:flex; align-items:center; gap:52px; flex-wrap:wrap-reverse; }
  .hero-copy{ flex:1 1 380px; min-width:280px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; font-weight:800; color: var(--link);
    background: rgba(47,111,237,0.08);
    padding:7px 14px; border-radius:999px; margin-bottom:18px;
  }
  .hero-name{ font-size: clamp(2rem, 4.6vw, 3.1rem); font-weight:900; color: var(--navy); }
  .hero-role{ margin-top:12px; font-size: clamp(1rem, 2vw, 1.2rem); font-weight:700; color: var(--ink-soft); max-width:52ch; }
  .hero-tagline{ margin-top:16px; font-size:16.5px; color: var(--link); font-weight:700; }
  .hero-cta{ margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family:inherit; font-weight:800; font-size:15px;
    padding:13px 26px; border-radius:14px; cursor:pointer; border:1.5px solid transparent;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn-primary{ background: linear-gradient(135deg, var(--blue), var(--blue-deep)); color:#fff; box-shadow: 0 12px 28px rgba(47,111,237,0.3); }
  .btn-primary:hover{ transform: translateY(-2px); }
  .btn-mint{ background: var(--mint); color:#06281f; box-shadow: 0 12px 28px rgba(20,184,146,0.28); }
  .btn-mint:hover{ transform: translateY(-2px); }
  .btn-ghost{ background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-ghost:hover{ border-color: var(--blue); color: var(--blue); }
  .hero-motto{ margin-top:26px; font-size:14.5px; color: var(--ink-soft); font-weight:700; }

  .hero-photo-wrap{ position:relative; flex:0 0 auto; width:min(260px,58vw); }
  .hero-photo-frame{
    position:relative; border-radius: 30px;
    overflow:hidden;
    box-shadow: 0 22px 50px rgba(8,14,30,.35), 0 0 0 1px rgba(255,255,255,.18) inset;
    background: linear-gradient(150deg, var(--blue), var(--mint) 55%, var(--yellow));
    padding:7px;
    transition: transform .25s ease;
  }
  .hero-photo-frame:hover{ transform: translateY(-3px) rotate(-.6deg); }
  .hero-photo{ width:100%; aspect-ratio:1/1; object-fit:cover; object-position:center 30%; border-radius: 23px; display:block; background:var(--card); }
  .hero-blob{
    position:absolute; inset-inline-end:-30px; top:-30px; width:120px; height:120px;
    background: var(--mint); opacity:.18; border-radius:50%; z-index:-1;
  }

  /* Sections */
  section{ padding: 64px 0; }
  .section-head{ margin-bottom:30px; }
  .kicker{ font-size:13px; font-weight:800; color: var(--mint); letter-spacing:.03em; margin-bottom:8px; }
  .section-head h2{ font-size: clamp(1.4rem,3vw,1.9rem); font-weight:900; color: var(--navy); }

  .about-text{ max-width:72ch; color: var(--ink-soft); font-size:17px; }

  .skills-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .skill-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius-md);
    padding:22px; box-shadow: 0 10px 26px rgba(18,36,71,0.05);
  }
  .skill-card .dot{ width:10px; height:10px; border-radius:50%; background: var(--mint); margin-bottom:14px; }
  .skill-card h3{ font-size:16px; font-weight:800; color: var(--navy); }

  .services-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; }
  .service-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius-lg);
    overflow:hidden; box-shadow: 0 12px 30px rgba(18,36,71,0.07);
    transition: transform .2s ease, box-shadow .2s ease;
    display:flex; flex-direction:column;
  }
  .service-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow); }
  .service-media{
    height:140px; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, rgba(47,111,237,0.12), rgba(20,184,146,0.14));
    font-size:34px; font-weight:900; color: var(--link);
  }
  .service-media img{ width:100%; height:100%; object-fit:cover; }
  .service-body{ padding:20px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .service-body h3{ font-size:17px; font-weight:800; color: var(--navy); }
  .service-body p{ font-size:14.5px; color: var(--ink-soft); flex:1; }
  .service-link{ font-size:13.5px; font-weight:800; color: var(--link); }
  .service-link:hover{ text-decoration:underline; }

  .work-banner{
    background: linear-gradient(135deg, #122447, #1c3568);
    color:#fff; border-radius: var(--radius-lg);
    padding: 34px 30px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .work-banner h3{ font-size:19px; font-weight:800; }
  .work-banner p{ color: rgba(255,255,255,0.75); margin-top:6px; font-size:14.5px; }

  .contact-grid{ display:grid; grid-template-columns: 1.1fr 1fr; gap:30px; }
  @media (max-width:760px){ .contact-grid{ grid-template-columns:1fr; } }
  .contact-emails{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .contact-emails a{ font-weight:700; color: var(--link); font-size:15px; }
  .contact-emails a:hover{ text-decoration:underline; }
  .social-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:18px; }
  .social-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; font-weight:700; font-size:13.5px;
    transition: border-color .18s ease, transform .18s ease;
  }
  .social-chip:hover{ border-color: var(--blue); transform: translateY(-2px); }
  .social-chip .ic{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background: var(--yellow); color:#1B1300; font-size:11.5px; font-weight:900; flex:0 0 auto;
  }
  .social-chip span.nm{ line-height:1.3; }

  .site-footer{ padding: 40px 24px 56px; text-align:center; border-top:1px solid var(--line); }
  .site-footer p{ font-size:14px; color: var(--ink-soft); }
  .site-footer p.dua{ color: var(--navy); font-weight:800; margin-bottom:8px; font-size:15px; }


  /* Gallery */
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .g-card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
  .g-img{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;aspect-ratio:4/3;overflow:hidden}
  .g-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
  .g-img:hover img{transform:scale(1.04)}
  .g-card video,.vwrap{width:100%;display:block;aspect-ratio:16/9;background:#000}
  .vwrap iframe{width:100%;height:100%;border:0}
  .g-card figcaption{padding:12px 14px;font-weight:700;font-size:14px}
  .lb{position:fixed;inset:0;z-index:150;background:rgba(5,8,16,.92);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
  .lb img{max-width:100%;max-height:100%;border-radius:12px}
  /* Login + Admin */
  .login{position:fixed;inset:0;z-index:110;background:rgba(5,8,16,.7);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
  .login-card{width:min(380px,100%);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:24px}
  .login-card h2{margin:0 0 16px;font-size:18px;font-weight:900;display:flex;justify-content:space-between}
  .login-err{color:#d64545;font-size:13px;min-height:20px;margin:8px 0}

function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function adoptRemote(r){ var d=state.lang; state=deepMerge(clone(DEFAULTS),r); state.lang=d; }
async function initFirebase(){
  try{
    var base='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(base+'firebase-app-compat.js');
    await Promise.all(['auth','firestore','storage'].map(function(n){ return loadScript(base+'firebase-'+n+'-compat.js'); }));
    firebase.initializeApp(FIREBASE_CONFIG);
    fb.auth=firebase.auth(); fb.db=firebase.firestore();
    try{ if(FIREBASE_CONFIG.storageBucket) fb.st=firebase.storage(); }catch(e){}
    try{
      var snap=await fb.db.collection('portfolio').doc('main').get();
      if(snap.exists && snap.data().json){ var r=JSON.parse(snap.data().json); adoptRemote(r); try{ localStorage.setItem('mz_cache',snap.data().json); }catch(e){} renderAll(); }
    }catch(e){ console.warn('load',e); }
    fb.auth.onAuthStateChanged(function(u){ fb.user=u; $('editBtn').hidden=!u; if(u&&location.hash==='#admin'){ closeLogin(); openAdmin(); } });
  }catch(e){ console.warn('firebase',e); }
}

/* ---------- Uploads ---------- */
function compress(file,keepPng){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1600, r=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b||file); }, keepPng?'image/png':'image/jpeg', .86);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); res(file); }; img.src=url;
  });
}
function toDataUrl(b){ return new Promise(function(res,rej){ var f=new FileReader(); f.onload=function(){res(f.result);}; f.onerror=rej; f.readAsDataURL(b); }); }
function setProg(p){ var b=$('progBar'); b.parentNode.hidden = p==null; if(p!=null) b.style.width=p+'%'; }
async function upload(file,folder){
  var isImg=/^image\//.test(file.type), blob=file;
  if(isImg && !/svg|gif/.test(file.type)) blob=await compress(file, folder==='logo'&&file.type==='image/png');
  if(!fb.st){
    if(isImg && blob.size<300*1024) return toDataUrl(blob);
    throw new Error(FB_ON?'فعّل Firebase Storage من لوحة Firebase أولًا (Blaze plan).':'اربط Firebase أولًا لرفع الملفات الكبيرة والفيديو.');
  }
  if(file.size>60*1024*1024) throw new Error('الحد الأقصى للملف 50MB.');
  var ext=(blob.type.split('/')[1]||'bin').replace('jpeg','jpg').replace(/[^a-z0-9]/gi,'');
  var ref=fb.st.ref('portfolio/'+folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext);
  var task=ref.put(blob,{contentType:blob.type||file.type});
  return new Promise(function(res,rej){
    task.on('state_changed',function(s){ setProg(Math.round(s.bytesTransferred/s.totalBytes*100)); },function(e){ setProg(null); rej(e); },function(){ task.snapshot.ref.getDownloadURL().then(function(u){ setProg(null); res(u); },rej); });
  });
}

async function save(){
  if(!FB_ON){ toast('Firebase غير مربوط بعد — استخدم تبويب «نسخ احتياطي» لتصدير بياناتك.'); return; }
  if(!fb.user){ toast('سجّل الدخول أولًا.'); return; }
  var out=clone(state); out.lang=state.defaultLang||'ar'; var js=JSON.stringify(out);
  if(js.length>950000){ toast('حجم البيانات كبير — ارفع الصور عبر Storage بدل تضمينها.'); return; }
  try{
    await fb.db.collection('portfolio').doc('main').set({json:js,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
    try{ localStorage.setItem('mz_cache',js); }catch(e){}
    dirty=false; toast('تم الحفظ ونشر التعديلات ✅');
  }catch(e){ console.error(e); toast(e.code==='permission-denied'?'ليس لديك صلاحية الكتابة — راجع قواعد الأمان (Rules) والـ UID.':'تعذّر الحفظ: '+(e.message||e)); }
}

    LIST('partners','شريك',function(i){ return BI('اسم الشريك','partners.'+i+'.name')+U('شعار الشريك','partners.'+i+'.logo',{folder:'partners'})+BI('نبذة مختصرة عن الشريك','partners.'+i+'.bio',true)+F('موقع الويب','partners.'+i+'.website',{type:'url',dir:1,ph:'https://...'})+'<div class="row2">'+F('صفحة فيسبوك','partners.'+i+'.facebook',{type:'url',dir:1,ph:'https://facebook.com/...'})+F('حساب إنستجرام','partners.'+i+'.instagram',{type:'url',dir:1,ph:'https://instagram.com/...'})+'</div>'; });
  }
  else if(tab==='custom'){
    h+='<div class="banner">أنشئ أي قسم جديد (مثل: عملاؤنا، آراء العملاء، إنجازاتنا…) بعنوان ونبذة مختصرة وبطاقات بداخله. يظهر قبل قسم التواصل ويُضاف تلقائيًا للقائمة العلوية.</div>'+
    LIST('customSections','قسم',function(i){ return '<label class="chk"><input type="checkbox" data-p="customSections.'+i+'.visible"'+(state.customSections[i].visible!==false?' checked':'')+'> إظهار القسم</label>'+BI('عنوان القسم','customSections.'+i+'.title')+BI('نبذة مختصرة عن القسم','customSections.'+i+'.desc',true)+H('عناصر القسم')+
      LIST('customSections.'+i+'.items','عنصر',function(j){ var b='customSections.'+i+'.items.'+j; return BI('العنوان',b+'.title')+BI('النص',b+'.text',true)+F('رابط (اختياري)',b+'.link',{type:'url',dir:1})+U('صورة (اختيارية)',b+'.image',{folder:'sections'}); }); });
  }
  else if(tab==='sectext'){
    h+='<div class="banner">عدّل العنوان الصغير والعنوان والنبذة المختصرة لكل قسم. اترك الخانة فارغة لاستخدام النص الافتراضي.</div>'+
    [['about','نبذة عني'],['skills','المهارات'],['services','الخدمات'],['gallery','المعرض'],['partners','شركاؤنا'],['contact','التواصل']].map(function(s){ return H(s[1])+BI('العنوان الصغير','sectionMeta.'+s[0]+'.kicker')+BI('العنوان','sectionMeta.'+s[0]+'.title')+(s[0]==='about'?'':BI('نبذة مختصرة','sectionMeta.'+s[0]+'.desc',true)); }).join('');
  }
  else if(tab==='links'){
    h+=H('زر GitHub / الأعمال')+BI('عنوان القسم','work.title')+BI('نص فرعي','work.sub')+F('رابط GitHub (حسابك الكامل)','work.url',{type:'url',dir:1})+H('حسابات التواصل')+
      Object.keys(state.socials).map(function(k){ var m=SOCIAL[k]||{ar:k,en:k}; return F(m.ar+' / '+m.en,'socials.'+k,{type:'url',dir:1,ph:'https://...'}); }).join('')+
      '<div class="hint2">الرابط الناقص (مثل linkedin.com/in/ بدون اسمك) لا يظهر للزوار حتى تكمله.</div>';
  }
  else if(tab==='theme'){
    ['light','dark'].forEach(function(m){
      h+=H(m==='light'?'☀️ ألوان الوضع النهاري':'🌙 ألوان الوضع الليلي')+'<div class="colors">'+COLOR_LABELS.map(function(c){ return '<div class="f"><label>'+c[1]+'</label><input type="color" data-p="theme.'+m+'.'+c[0]+'" value="'+esc(state.theme[m][c[0]])+'"></div>'; }).join('')+'</div>'+
        '<div class="f"><label>شفافية صورة الخلفية: <b>'+(m==='light'?state.theme.heroOpacity:state.theme.heroOpacityDark)+'%</b></label><input type="range" min="0" max="100" data-p="theme.'+(m==='light'?'heroOpacity':'heroOpacityDark')+'" data-num="1" data-rr="1" value="'+(m==='light'?state.theme.heroOpacity:state.theme.heroOpacityDark)+'"></div>'+
        '<button type="button" class="sbtn" data-act="resetTheme" data-m="'+m+'">↺ إعادة ألوان هذا الوضع للافتراضي</button>';
    });
    h+=H('🖼️ صورة خلفية الواجهة')+U('صورة الخلفية (اتركها فارغة للافتراضية)','theme.heroImage',{folder:'theme'});
  }
  else if(tab==='sections'){
    h+='<div class="banner">تحكم في ظهور أقسام الموقع للزوار.</div>'+[['about','نبذة عني'],['skills','المهارات'],['services','الخدمات'],['work','بانر GitHub'],['gallery','المعرض'],['partners','شركاؤنا'],['contact','التواصل']].map(function(s){
      return '<label class="chk"><input type="checkbox" data-p="sections.'+s[0]+'"'+(state.sections[s[0]]!==false?' checked':'')+'> '+s[1]+'</label>'; }).join('');
  }
  else if(tab==='settings'){
    h+='<div class="f"><label>اللغة الافتراضية للزوار</label><select data-p="defaultLang"><option value="ar"'+(state.defaultLang==='en'?'':' selected')+'>العربية</option><option value="en"'+(state.defaultLang==='en'?' selected':'')+'>English</option></select></div>'+
      H('SEO — ظهور الموقع في جوجل')+BI('عنوان الصفحة','seo.title')+BI('وصف الصفحة (150 حرفًا تقريبًا)','seo.description',true)+
      H('حالة الربط')+'<div class="banner">Firebase: '+(FB_ON?(fb.user?'متصل ✅ — '+esc(fb.user.email||''):'مفعّل — غير مسجّل دخول'):'غير مربوط (وضع المعاينة)')+'<br>Storage (رفع الملفات): '+(fb.st?'مفعّل ✅':'غير متاح')+'</div>';
  }
  else if(tab==='backup'){
    h+='<div class="banner">صدّر نسخة من كل بياناتك (JSON) أو استورد نسخة سابقة.</div><div class="upl"><button type="button" class="sbtn pri" data-act="export">⬇ تصدير البيانات</button><button type="button" class="sbtn" data-act="pick">⬆ استيراد ملف JSON</button><input type="file" hidden accept="application/json,.json" id="importFile"></div>'+
      H('منطقة الخطر')+'<button type="button" class="sbtn danger" data-act="reset">إعادة كل شيء للافتراضي</button>';
  }
  b.innerHTML=h;
}
function renderTabs(){
  $('admSide').innerHTML=TABS.map(function(t){ return '<button type="button" class="adm-tab'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'; }).join('');
}
function openAdmin(){ adminOpen=true; $('adm').hidden=false; document.body.style.overflow='hidden'; renderTabs(); renderTab(); }
function closeAdmin(){ if(dirty&&!confirm('لديك تعديلات غير محفوظة. إغلاق على أي حال؟')) return; adminOpen=false; $('adm').hidden=true; document.body.style.overflow=''; history.replaceState(null,'',location.pathname+location.search); }
var rt=null; function soon(){ clearTimeout(rt); rt=setTimeout(renderAll,120); }

$('admSide').addEventListener('click',function(e){ var b=e.target.closest('[data-tab]'); if(!b) return; tab=b.getAttribute('data-tab'); renderTabs(); renderTab(); });
$('admBody').addEventListener('input',function(e){
  var el=e.target, p=el.getAttribute('data-p'); if(!p) return;
  var v=el.type==='checkbox'?el.checked:(el.hasAttribute('data-num')?+el.value:el.value);
  setPath(state,p,v); dirty=true; soon();
  if(el.hasAttribute('data-rr')){ renderAll(); renderTab(); }
});
$('admBody').addEventListener('change',async function(e){
  var el=e.target;
  if(el.id==='importFile'){
    var f=el.files[0]; if(!f) return;
    try{ var r=JSON.parse(await f.text()); adoptRemote(r); dirty=true; renderAll(); renderTab(); toast('تم الاستيراد — اضغط حفظ للنشر.'); }catch(x){ toast('ملف غير صالح.'); }
    return;
  }
  var path=el.getAttribute('data-up'); if(!path) return;
  var f2=el.files[0]; if(!f2) return;
  try{ toast('جاري الرفع…'); var url=await upload(f2,el.getAttribute('data-folder')||'images'); setPath(state,path,url); dirty=true; renderAll(); renderTab(); toast('تم الرفع ✅ — اضغط حفظ للنشر.'); }
  catch(x){ console.error(x); setProg(null); toast('تعذّر الرفع: '+(x.message||x.code||x)); }
});
$('admBody').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return; var a=b.getAttribute('data-act'), l=b.getAttribute('data-l'), i=+b.getAttribute('data-i');
  if(a==='pick'){ var inp=b.parentNode.querySelector('input[type=file]'); if(inp) inp.click(); return; }
  var arr=l?getPath(state,l):null; if(l&&!arr){ setPath(state,l,[]); arr=getPath(state,l); }
  if(a==='add'){ arr.push(NEW[l.split('.').pop()]()); }
  else if(a==='del'){ if(!confirm('حذف هذا العنصر؟')) return; arr.splice(i,1); }
  else if(a==='up'&&i>0){ arr.splice(i-1,0,arr.splice(i,1)[0]); }
  else if(a==='down'&&i<arr.length-1){ arr.splice(i+1,0,arr.splice(i,1)[0]); }
  else if(a==='resetTheme'){ var m=b.getAttribute('data-m'); state.theme[m]=clone(DEFAULTS.theme[m]); }
  else if(a==='export'){ var u=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:'application/json'})), k=document.createElement('a'); k.href=u; k.download='portfolio-backup.json'; k.click(); setTimeout(function(){URL.revokeObjectURL(u);},2000); return; }
  else if(a==='reset'){ if(!confirm('سيتم مسح كل التعديلات غير المنشورة والرجوع للافتراضي. متأكد؟')) return; state=clone(DEFAULTS); }
  else return;
  dirty=true; renderAll(); renderTab();
});
$('admSave').addEventListener('click',save);
$('admClose').addEventListener('click',closeAdmin);
$('admPreview').addEventListener('click',function(){ $('themeToggle').click(); });
$('admLogout').addEventListener('click',async function(){ if(fb.auth&&fb.user){ await fb.auth.signOut(); } dirty=false; closeAdmin(); });
$('editBtn').addEventListener('click',openAdmin);
window.addEventListener('beforeunload',function(e){ if(dirty&&adminOpen){ e.preventDefault(); e.returnValue=''; } });

function route(){
  if(location.hash!=='#admin') return;
  if(!FB_ON){ $('editBtn').hidden=false; openAdmin(); }
  else if(fb.user) openAdmin(); else if(fb.auth) openLogin();
}
window.addEventListener('hashchange',route);

/* ---------- Boot ---------- */
try{ var c=localStorage.getItem('mz_cache'); if(c&&FB_ON) adoptRemote(JSON.parse(c)); }catch(e){}
state.lang=state.defaultLang||state.lang||'ar';
renderAll();
if(FB_ON){ initFirebase().then(route); } else { route(); }
})();

</script>

</body>
</html>
