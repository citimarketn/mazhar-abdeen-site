<style>

    --ink:#0E1B2B;

    --blue:#2F6FED;

    --mint:#14B892;
    --line: rgba(14,27,43,0.10);

    --shadow: 0 18px 46px rgba(18,36,71,0.12);

  @media (prefers-color-scheme: dark){

      --bg-2:#141B29;
      --ink:#EDEFF4;
      --ink-soft:#A9B2C4;
      --navy:#EDEFF4;
      --line: rgba(237,239,244,0.12);
      --card:#171E2D;
      --shadow: 0 18px 46px rgba(0,0,0,0.4);

  :root[data-theme="dark"]{
    --bg:#0E1420;
    --bg-2:#141B29;
    --ink:#EDEFF4;
    --ink-soft:#A9B2C4;
    --navy:#EDEFF4;
    --line: rgba(237,239,244,0.12);
    --card:#171E2D;
    --shadow: 0 18px 46px rgba(0,0,0,0.4);
  }
  body{ transition: background .25s ease, color .25s ease; }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){

    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family:"Cairo","Segoe UI",sans-serif;

  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }
  h1,h2,h3,p{ margin:0; }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:3px; border-radius:6px; }
  [hidden]{ display:none !important; }

  .wrap{ max-width:1100px; margin-inline:auto; padding-inline:24px; }

  /* Navbar */
  .navbar{
    position:sticky; top:0; z-index:40;
    background: rgba(250,249,246,0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 24px;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:15px; }
  .brand-badge{
    width:36px; height:36px; border-radius:11px;
    background: linear-gradient(135deg, var(--blue), var(--mint));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:14px;
  }
  .nav-links{ display:flex; gap:26px; align-items:center; }
  .nav-links a{ font-size:14.5px; font-weight:700; color: var(--ink-soft); }
  .nav-links a:hover{ color: var(--blue); }
  .nav-actions{ display:flex; gap:10px; align-items:center; }
  @media (max-width:720px){ .nav-links{ display:none; } }

  .pill-btn{
    font-family:inherit; font-weight:700; font-size:13.5px;
    background: var(--card); color: var(--ink);
    border: 1.5px solid var(--line);
    padding: 8px 16px; border-radius:999px; cursor:pointer;
    transition: border-color .18s ease, transform .18s ease;
  }
  .pill-btn:hover{ border-color: var(--blue); transform: translateY(-1px); }

  /* Hero */
  .hero{ padding: 64px 0 30px; overflow:hidden; }
  .hero-inner{ display:flex; align-items:center; gap:52px; flex-wrap:wrap-reverse; }
  .hero-copy{ flex:1 1 380px; min-width:280px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;

    background: rgba(47,111,237,0.08);
    padding:7px 14px; border-radius:999px; margin-bottom:18px;

  .hero-name{ font-size: clamp(2rem, 4.6vw, 3.1rem); font-weight:900; color: var(--navy); }
  .hero-role{ margin-top:12px; font-size: clamp(1rem, 2vw, 1.2rem); font-weight:700; color: var(--ink-soft); max-width:52ch; }
  .hero-tagline{ margin-top:16px; font-size:16.5px; color: var(--blue-deep); font-weight:700; }
  .hero-cta{ margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family:inherit; font-weight:800; font-size:15px;
    padding:13px 26px; border-radius:14px; cursor:pointer; border:1.5px solid transparent;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn-primary{ background: linear-gradient(135deg, var(--blue), var(--blue-deep)); color:#fff; box-shadow: 0 12px 28px rgba(47,111,237,0.3); }
  .btn-primary:hover{ transform: translateY(-2px); }
  .btn-mint{ background: var(--mint); color:#06281f; box-shadow: 0 12px 28px rgba(20,184,146,0.28); }
  .btn-mint:hover{ transform: translateY(-2px); }
  .btn-ghost{ background: transparent; border-color: var(--line); color: var(--ink); }
  .btn-ghost:hover{ border-color: var(--blue); color: var(--blue); }
  .hero-motto{ margin-top:26px; font-size:14.5px; color: var(--ink-soft); font-weight:700; }

  .hero-photo-wrap{ position:relative; flex:0 0 auto; width:min(260px,58vw); }
  .hero-photo-frame{
    position:relative; border-radius: var(--radius-lg);
    overflow:hidden; border: 1px solid var(--line);
    box-shadow: var(--shadow);
    background: linear-gradient(160deg, var(--blue), var(--mint));
    padding:6px;
  }
  .hero-photo{ width:100%; aspect-ratio:1/1; object-fit:cover; border-radius: 22px; display:block; }
  .hero-blob{
    position:absolute; inset-inline-end:-30px; top:-30px; width:120px; height:120px;
    background: var(--mint); opacity:.18; border-radius:50%; z-index:-1;
  }

  /* Sections */
  section{ padding: 64px 0; }
  .section-head{ margin-bottom:30px; }
  .kicker{ font-size:13px; font-weight:800; color: var(--mint); letter-spacing:.03em; margin-bottom:8px; }
  .section-head h2{ font-size: clamp(1.4rem,3vw,1.9rem); font-weight:900; color: var(--navy); }

  .about-text{ max-width:72ch; color: var(--ink-soft); font-size:17px; }

  .skills-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
  .skill-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius-md);
    padding:22px; box-shadow: 0 10px 26px rgba(18,36,71,0.05);

  .skill-card h3{ font-size:16px; font-weight:800; color: var(--navy); }

  .services-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; }
  .service-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius-lg);
    overflow:hidden; box-shadow: 0 12px 30px rgba(18,36,71,0.07);
    transition: transform .2s ease, box-shadow .2s ease;
    display:flex; flex-direction:column;

  .service-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow); }
  .service-media{
    height:140px; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, rgba(47,111,237,0.12), rgba(20,184,146,0.14));

  .service-body{ padding:20px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .service-body h3{ font-size:17px; font-weight:800; color: var(--navy); }
  .service-body p{ font-size:14.5px; color: var(--ink-soft); flex:1; }
  .service-link{ font-size:13.5px; font-weight:800; color: var(--blue-deep); }
  .service-link:hover{ text-decoration:underline; }

  .work-banner{
    background: linear-gradient(135deg, var(--navy), #1c3568);
    color:#fff; border-radius: var(--radius-lg);
    padding: 34px 30px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .work-banner h3{ font-size:19px; font-weight:800; }
  .work-banner p{ color: rgba(255,255,255,0.75); margin-top:6px; font-size:14.5px; }

  .contact-grid{ display:grid; grid-template-columns: 1.1fr 1fr; gap:30px; }
  @media (max-width:760px){ .contact-grid{ grid-template-columns:1fr; } }
  .contact-emails{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .contact-emails a{ font-weight:700; color: var(--blue-deep); font-size:15px; }
  .contact-emails a:hover{ text-decoration:underline; }
  .social-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin-top:18px; }
  .social-chip{
    display:flex; align-items:center; gap:10px;
    background: var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; font-weight:700; font-size:13.5px;
    transition: border-color .18s ease, transform .18s ease;
  }
  .social-chip:hover{ border-color: var(--blue); transform: translateY(-2px); }
  .social-chip .ic{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--blue), var(--mint)); color:#fff; font-size:11.5px; font-weight:900;
  }

  .site-footer{ padding: 40px 24px 56px; text-align:center; border-top:1px solid var(--line); }
  .site-footer p{ font-size:14px; color: var(--ink-soft); }
  .site-footer p.dua{ color: var(--navy); font-weight:800; margin-bottom:8px; font-size:15px; }

  /* Admin */
  .admin-overlay{
    position:fixed; inset:0; background: rgba(10,15,26,0.6); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px; backdrop-filter: blur(4px);
  }
  .admin-panel{
    background:#fff; color: var(--ink); width:min(680px,100%); max-height:88vh;
    display:flex; flex-direction:column; border-radius: var(--radius-lg); overflow:hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
  .login-panel{ width:min(380px,100%); max-height:none; }
  .admin-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); }
  .admin-head h2{ font-size:17px; font-weight:800; }
  .icon-btn{ background:none; border:none; font-size:18px; cursor:pointer; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ background: rgba(14,27,43,0.06); }
  .admin-tabs{ display:flex; gap:6px; padding:12px 22px 0; overflow-x:auto; }
  .admin-tab{ font-family:inherit; font-weight:700; font-size:13px; padding:9px 15px; border-radius:999px 999px 0 0; background:transparent; border:none; cursor:pointer; color: var(--ink-soft); white-space:nowrap; }
  .admin-tab.active{ background: rgba(47,111,237,0.1); color: var(--blue-deep); }
  .admin-body{ padding:20px 22px; overflow-y:auto; flex:1; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; margin-bottom:6px; color: var(--ink-soft); }
  .field input, .field textarea{
    width:100%; font-family:inherit; font-size:14.5px; padding:10px 12px; border-radius:10px;
    border:1.5px solid var(--line); background:#fff; color: var(--ink);
  }
  .field textarea{ min-height:88px; resize:vertical; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .two-col{ grid-template-columns:1fr; } }
  .admin-foot{ padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; }
  .proj-block{ border:1.5px dashed var(--line); border-radius:14px; padding:16px; margin-bottom:16px; position:relative; }
  .proj-remove{ position:absolute; top:10px; inset-inline-end:10px; background:#fff; border:1px solid var(--line); border-radius:50%; width:26px; height:26px; cursor:pointer; font-size:13px; }
  .add-btn{ font-family:inherit; font-weight:700; font-size:14px; background: rgba(47,111,237,0.1); color: var(--blue-deep); border:none; padding:10px 18px; border-radius:999px; cursor:pointer; }
  .photo-row{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .photo-row img{ width:60px; height:60px; border-radius:14px; object-fit:cover; border:2px solid var(--blue); }
  .file-btn{ font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff; }
  .hint{ font-size:12px; color: var(--ink-soft); margin-top:4px; }
  .lock-note{ font-size:12.5px; color: var(--ink-soft); text-align:center; margin-top:14px; line-height:1.6; }

  .toast{
    position:fixed; bottom:26px; inset-inline-start:50%; transform: translateX(-50%);
    background: var(--navy); color:#fff; border:1px solid var(--line);
    padding:14px 24px; border-radius:999px; font-weight:700; font-size:14.5px;
    z-index:200; box-shadow: var(--shadow);
  }
  [dir="rtl"] .toast{ transform: translateX(50%); }
</style>
</head>

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

  function renderAll(){

    document.documentElement.dir = L==='ar' ? 'rtl' : 'ltr';

    document.getElementById('langToggle').textContent = t.langBtn;

    document.getElementById('brandName').textContent = tr(state.profile.name);
    document.getElementById('navAbout').textContent = t.navAbout;
    document.getElementById('navSkills').textContent = t.navSkills;
    document.getElementById('navServices').textContent = t.navServices;
    document.getElementById('navContact').textContent = t.navContact;

    document.getElementById('heroPhoto').src = state.profile.photo || "";
    document.getElementById('heroPhoto').alt = tr(state.profile.name);
    document.getElementById('heroLocation').textContent = tr(state.profile.location);

    document.getElementById('contactEmails').innerHTML = emailsHtml;

    var socialHtml = '';

  document.getElementById('langToggle').addEventListener('click', function(){ state.lang = state.lang==='ar'?'en':'ar'; renderAll(); });

  /* ---- Dark / light mode (per-viewer preference, stored locally) ---- */
  function applyTheme(mode){
    if(mode === 'dark' || mode === 'light'){ document.documentElement.setAttribute('data-theme', mode); }
    else { document.documentElement.removeAttribute('data-theme'); }
    document.getElementById('themeToggle').textContent = mode === 'dark' ? '☀️' : '🌙';
  }
  (function initTheme(){
    var saved = null;
    try{ saved = localStorage.getItem('mz_theme'); }catch(e){}
    applyTheme(saved);
  })();
  document.getElementById('themeToggle').addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    var isDark = current ? current === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = isDark ? 'light' : 'dark';
    applyTheme(next);
    try{ localStorage.setItem('mz_theme', next); }catch(e){}
  });

  /* ---------------- Admin ---------------- */
  var adminTabs = ['profile','about','skills','services','work','social'];
  var adminTabLabels = {profile:'الملف الشخصي', about:'نبذة عني', skills:'المهارات', services:'الخدمات', work:'GitHub', social:'روابط التواصل'};
  var activeTab = 'profile';
  var unlockedLocally = false;

  function openAdmin(){ document.getElementById('adminOverlay').hidden=false; renderAdminTabs(); renderAdminBody(); }
  function closeAdmin(){ document.getElementById('adminOverlay').hidden=true; }

  function renderAdminTabs(){
    var box = document.getElementById('adminTabs');
    box.innerHTML = adminTabs.map(function(k){ return '<button type="button" class="admin-tab '+(k===activeTab?'active':'')+'" data-tab="'+k+'">'+adminTabLabels[k]+'</button>'; }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.admin-tab'), function(btn){
      btn.addEventListener('click', function(){ activeTab = btn.getAttribute('data-tab'); renderAdminTabs(); renderAdminBody(); });
    });
  }

  function biFieldFixed(label, obj, key, multiline){
    var val = obj[key] || {ar:'',en:''};
    if(multiline){
      return '<div class="field"><label>'+esc(label)+' — AR</label><textarea data-bi="'+key+'" data-lang="ar">'+esc(val.ar||'')+'</textarea></div>'+
             '<div class="field"><label>'+esc(label)+' — EN</label><textarea data-bi="'+key+'" data-lang="en">'+esc(val.en||'')+'</textarea></div>';
    }
    return '<div class="field"><label>'+esc(label)+' — AR</label><input type="text" data-bi="'+key+'" data-lang="ar" value="'+esc(val.ar||'')+'"></div>'+
           '<div class="field"><label>'+esc(label)+' — EN</label><input type="text" data-bi="'+key+'" data-lang="en" value="'+esc(val.en||'')+'"></div>';
  }

  function bindBiInputs(scope){
    var body = document.getElementById('adminBody');
    Array.prototype.forEach.call(body.querySelectorAll('[data-bi]'), function(el){
      el.addEventListener('input', function(){
        var key = el.getAttribute('data-bi'), l = el.getAttribute('data-lang');
        if(!scope[key]) scope[key] = {ar:'',en:''};
        scope[key][l] = el.value; renderAll();
      });
    });
  }
  function bindSimple(id, obj, key){ document.getElementById(id).addEventListener('input', function(e){ obj[key]=e.target.value; renderAll(); }); }

  function renderAdminBody(){
    var body = document.getElementById('adminBody');
    if(activeTab==='profile'){
      body.innerHTML =
        '<div class="photo-row"><img id="photoPreview" src="'+esc(state.profile.photo||'')+'"><button type="button" class="file-btn" id="photoBtn">تغيير الصورة</button><input type="file" id="photoInput" accept="image/*" hidden></div>'+
        biFieldFixed('الاسم', state.profile, 'name')+
        biFieldFixed('المسمى الوظيفي', state.profile, 'role')+
        biFieldFixed('جملة تعريفية قصيرة', state.profile, 'tagline')+
        biFieldFixed('الموقع', state.profile, 'location')+
        '<div class="field"><label>دعاء / شعار شخصي</label><input type="text" id="mottoInput" value="'+esc(state.profile.motto||'')+'"></div>'+
        '<div class="field"><label>البريد الإلكتروني الأول</label><input type="email" id="emailInput" value="'+esc(state.profile.email||'')+'"></div>'+
        '<div class="field"><label>البريد الإلكتروني الثاني</label><input type="email" id="email2Input" value="'+esc(state.profile.email2||'')+'"></div>'+
        '<div class="field"><label>السيرة الذاتية (CV)</label><button type="button" class="file-btn" id="cvBtn">'+(state.profile.cvUrl?'استبدال ملف السيرة':'رفع ملف PDF')+'</button><input type="file" id="cvInput" accept="application/pdf" hidden><div class="hint" id="cvStatus">'+(state.profile.cvUrl?'تم رفع ملف السيرة الذاتية ✓':'لم يتم رفع ملف بعد')+'</div></div>';
      document.getElementById('photoBtn').addEventListener('click', function(){ document.getElementById('photoInput').click(); });
      document.getElementById('photoInput').addEventListener('change', function(e){
        var f=e.target.files[0]; if(!f) return;
        uploadAsset(f).then(function(url){ if(url){ state.profile.photo=url; document.getElementById('photoPreview').src=url; renderAll(); toast('تم تحديث الصورة'); } });
      });
      document.getElementById('cvBtn').addEventListener('click', function(){ document.getElementById('cvInput').click(); });
      document.getElementById('cvInput').addEventListener('change', function(e){
        var f=e.target.files[0]; if(!f) return;
        uploadAsset(f).then(function(url){ if(url){ state.profile.cvUrl=url; document.getElementById('cvStatus').textContent='تم رفع ملف السيرة الذاتية ✓'; renderAll(); toast('تم رفع السيرة الذاتية'); } });
      });
      bindSimple('mottoInput', state.profile, 'motto');
      bindSimple('emailInput', state.profile, 'email');
      bindSimple('email2Input', state.profile, 'email2');
      bindBiInputs(state.profile);

    } else if(activeTab==='about'){
      body.innerHTML = biFieldFixed('نبذة عني', {about:state.about}, 'about', true);
      bindBiInputs({about:state.about});

    } else if(activeTab==='skills'){
      var lines = (state.skills||[]).map(function(s){ return (s.ar||'')+' | '+(s.en||''); }).join('\n');
      body.innerHTML = '<div class="field"><label>مهارة واحدة في كل سطر: عربي | English</label><textarea id="skillsArea" style="min-height:160px">'+esc(lines)+'</textarea></div>';
      document.getElementById('skillsArea').addEventListener('input', function(e){
        state.skills = e.target.value.split('\n').map(function(line){
          line=line.trim(); if(!line) return null;
          var parts=line.split('|'); var ar=(parts[0]||'').trim(); var en=(parts[1]||ar).trim();
          return {ar:ar, en:en};
        }).filter(Boolean);
        renderAll();
      });

    } else if(activeTab==='services'){
      body.innerHTML = (state.services||[]).map(function(p,i){
        return '<div class="proj-block"><button type="button" class="proj-remove" data-remove="'+i+'">✕</button>'+
          '<div class="two-col">'+
            '<div class="field"><label>العنوان — AR</label><input type="text" class="pf" data-i="'+i+'" data-k="title" data-lang="ar" value="'+esc(p.title.ar||'')+'"></div>'+
            '<div class="field"><label>Title — EN</label><input type="text" class="pf" data-i="'+i+'" data-k="title" data-lang="en" value="'+esc(p.title.en||'')+'"></div>'+
          '</div>'+
          '<div class="two-col">'+
            '<div class="field"><label>الوصف — AR</label><textarea class="pf" data-i="'+i+'" data-k="description" data-lang="ar">'+esc(p.description.ar||'')+'</textarea></div>'+
            '<div class="field"><label>Description — EN</label><textarea class="pf" data-i="'+i+'" data-k="description" data-lang="en">'+esc(p.description.en||'')+'</textarea></div>'+
          '</div>'+
          '<div class="field"><label>رابط (اختياري)</label><input type="url" class="pf" data-i="'+i+'" data-k="link" value="'+esc(p.link||'')+'"></div>'+
          '<div class="field"><label>صورة</label><button type="button" class="file-btn proj-img-btn" data-i="'+i+'">رفع صورة</button><input type="file" accept="image/*" hidden class="proj-img-input" data-i="'+i+'"></div>'+
        '</div>';
      }).join('') + '<button type="button" class="add-btn" id="addService">+ إضافة خدمة جديدة</button>';
      Array.prototype.forEach.call(body.querySelectorAll('.pf'), function(el){
        el.addEventListener('input', function(){
          var i=+el.getAttribute('data-i'), k=el.getAttribute('data-k'), l=el.getAttribute('data-lang');
          if(l){ state.services[i][k][l]=el.value; } else { state.services[i][k]=el.value; }
          renderAll();
        });
      });
      Array.prototype.forEach.call(body.querySelectorAll('[data-remove]'), function(btn){
        btn.addEventListener('click', function(){ state.services.splice(+btn.getAttribute('data-remove'),1); renderAll(); renderAdminBody(); });
      });
      Array.prototype.forEach.call(body.querySelectorAll('.proj-img-btn'), function(btn){
        btn.addEventListener('click', function(){ body.querySelector('.proj-img-input[data-i="'+btn.getAttribute('data-i')+'"]').click(); });
      });
      Array.prototype.forEach.call(body.querySelectorAll('.proj-img-input'), function(inp){
        inp.addEventListener('change', function(e){
          var f=e.target.files[0]; if(!f) return; var i=+inp.getAttribute('data-i');
          uploadAsset(f).then(function(url){ if(url){ state.services[i].image=url; renderAll(); toast('تم رفع الصورة'); } });
        });
      });
      document.getElementById('addService').addEventListener('click', function(){
        state.services.push({title:{ar:'',en:''}, description:{ar:'',en:''}, image:'', link:''});
        renderAll(); renderAdminBody();
      });

    } else if(activeTab==='work'){
      body.innerHTML = biFieldFixed('عنوان القسم', state.work, 'title') +
        biFieldFixed('نص فرعي', state.work, 'sub') +
        '<div class="field"><label>رابط GitHub</label><input type="url" id="workUrl" value="'+esc(state.work.url||'')+'"></div>';
      bindBiInputs(state.work);
      bindSimple('workUrl', state.work, 'url');

    } else if(activeTab==='social'){
      body.innerHTML = Object.keys(state.socials).map(function(key){
        var meta = SOCIAL_META[key] || {ar:key, en:key};
        return '<div class="field"><label>'+esc(meta.ar)+' / '+esc(meta.en)+'</label><input type="url" class="soc" data-key="'+key+'" placeholder="https://..." value="'+esc(state.socials[key]||'')+'"></div>';
      }).join('');
      Array.prototype.forEach.call(body.querySelectorAll('.soc'), function(inp){
        inp.addEventListener('input', function(){ state.socials[inp.getAttribute('data-key')] = inp.value.trim(); renderAll(); });
      });
    }
  }

  async function uploadAsset(file){
    try{
      var assets = await claude.use('assets');
      if(!assets){ toast(T[lang()].noAccess); return null; }
      var res = await assets.upload(file);
      return res && res.url;
    }catch(e){ console.error(e); toast(T[lang()].failed); return null; }
  }

  async function checkEditAccess(){
    try{
      var user = await claude.use('user');
      if(!user) return false;
      var val = user.canEdit ? user.canEdit() : (user.isOwner ? user.isOwner() : false);
      return await Promise.resolve(val);
    }catch(e){ return false; }
  }

  async function saveAndPublish(){
    var t = T[lang()];
    document.getElementById('portfolio-data').textContent = JSON.stringify(state);
    renderAll();
    try{
      var artifact = await claude.use('artifact');
      if(!artifact){ toast(t.noAccess); return; }
      var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      await artifact.publish(html);
      toast(t.saved);
      closeAdmin();
    }catch(e){ console.error(e); toast(t.failed); }
  }

  document.getElementById('adminClose').addEventListener('click', closeAdmin);
  document.getElementById('adminSave').addEventListener('click', saveAndPublish);
  document.getElementById('editBtn').addEventListener('click', openAdmin);

  /* ---- Secret PIN login (for access when not recognized as the Claude owner) ---- */
  async function sha256Hex(str){
    var buf = new TextEncoder().encode(str);
    var digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.prototype.map.call(new Uint8Array(digest), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }
  function openLogin(){ document.getElementById('loginOverlay').hidden = false; }
  function closeLogin(){ document.getElementById('loginOverlay').hidden = true; }
  document.getElementById('loginClose').addEventListener('click', closeLogin);
  document.getElementById('loginSubmit').addEventListener('click', async function(){
    var phone = document.getElementById('phoneInput').value.replace(/\s+/g,'');
    var pin = document.getElementById('pinInput').value.trim();
    var hash = await sha256Hex(phone + ':' + pin);
    if(hash === state.pinHash){
      unlockedLocally = true;
      try{ sessionStorage.setItem('mz_admin_unlocked','1'); }catch(e){}
      closeLogin();
      document.getElementById('editBtn').hidden = false;
      toast(lang()==='ar' ? 'تم الدخول ✅' : 'Logged in ✅');
    } else {
      toast(T[lang()].loginWrong);
    }
  });

  if(location.hash === '#admin'){
    try{
      if(sessionStorage.getItem('mz_admin_unlocked') === '1'){
        unlockedLocally = true;
      }
    }catch(e){}
    if(unlockedLocally){ document.getElementById('editBtn').hidden = false; }
    else { openLogin(); }
  }

  renderAll();
  checkEditAccess().then(function(can){ if(can){ document.getElementById('editBtn').hidden = false; } });

})();
</script>
